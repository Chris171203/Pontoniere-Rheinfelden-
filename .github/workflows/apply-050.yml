name: Apply Android 0.5.0 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply source patch
        run: |
          cat tools/0.5.0.patch.part1 tools/0.5.0.patch.part2 tools/0.5.0.patch.part3 > /tmp/0.5.0.patch
          git apply --check /tmp/0.5.0.patch
          git apply /tmp/0.5.0.patch

      - name: Reject personal PFVR access links
        run: |
          if grep -R -n -E 'id_person=|intern\.pfvr\.ch/index\.php\?what=|key=[0-9a-fA-F]{32,}' Android --exclude-dir=build; then
            echo 'Personal PFVR access data found in Android source.' >&2
            exit 1
          fi

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build and verify
        working-directory: Android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify package
        run: |
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app' versionCode='8' versionName='0.5.0'"

      - name: Commit verified source
        run: |
          rm -rf Android/app/build Android/.gradle tools/0.5.0.patch.part* .github/workflows/apply-050.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Android test 0.5.0'
          git push origin HEAD:${{ github.head_ref }}
