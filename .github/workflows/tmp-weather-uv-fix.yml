name: Temporary weather UV fix

on:
  push:
    branches: [fix/weather-uv-data]
    paths: ['.github/workflows/tmp-weather-uv-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-uv-data

      - name: Keep UV row visible when source is unavailable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java')
          text=path.read_text()
          old='''        if(Double.isFinite(summary.uvMax))\n            details.append("\\nUV ").append(String.format(Locale.GERMAN,"%.1f",summary.uvMax)).append(" · ").append(uvLabel(summary.uvMax));'''
          new='''        details.append("\\nUV ");\n        if(Double.isFinite(summary.uvMax))details.append(String.format(Locale.GERMAN,"%.1f",summary.uvMax)).append(" · ").append(uvLabel(summary.uvMax));\n        else details.append("–");'''
          if text.count(old)!=1:
              raise SystemExit(f'expected one daily UV block, got {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests and compile
        working-directory: Android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Commit tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          git diff --cached --check
          git commit -m 'Keep UV row visible in 3-day weather'
          git push origin HEAD:fix/weather-uv-data
