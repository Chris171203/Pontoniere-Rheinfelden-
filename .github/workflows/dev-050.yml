name: Dev Android 0.5.0

on:
  push:
    branches:
      - dev-0.5.0

permissions:
  contents: write

concurrency:
  group: pfvr-dev-050
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.5.0
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply 0.5.0 source patches
        run: |
          python tools/apply_050.py
          python tools/apply_twint_050.py

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build APK and App Bundle
        working-directory: Android
        run: gradle --no-daemon assembleDebug bundleDebug

      - name: Verify APK
        run: |
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app' versionCode='8' versionName='0.5.0'"
          grep -q 'TWINT_QR_PDF' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -q 'Zeit · 24 h' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -q '19:30–21:00 Uhr' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java

      - name: Persist verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'Apply verified Android 0.5.0 source'
            git pull --rebase origin dev-0.5.0
            git push origin HEAD:dev-0.5.0
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-test-0.5.0-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-test-0.5.0-aab
          path: Android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
