name: Dev Android 0.5.0

on:
  push:
    branches:
      - dev-0.5.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.5.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply 0.5.0 source patch
        run: python tools/apply_050.py

      - name: Probe PFVR payment media
        run: python tools/probe_twint.py

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build APK and App Bundle
        working-directory: Android
        run: gradle --no-daemon assembleDebug bundleDebug

      - name: Verify APK
        run: |
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app' versionCode='8' versionName='0.5.0'"

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Android 0.5.0 UI fixes'
            git push origin HEAD:dev-0.5.0
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-test-0.5.0-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-test-0.5.0-aab
          path: Android/app/build/outputs/bundle/debug/app-debug.aab
