name: Temporary persistent person restore

on:
  push:
    branches:
      - fix/remember-selected-person-0.12.1
    paths:
      - .github/workflows/tmp-remember-person.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remember-selected-person-0.12.1

      - name: Apply persistent person restore patch
        run: python3 .github/tmp-remember-person.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests, lint and debug build
        working-directory: Android
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleDebug

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/build.gradle \
                  Android/app/src/main/java/ch/pfvr/internapp/InternalAttendanceSkin.java \
                  Android/app/src/test/java/ch/pfvr/internapp/InternalAttendanceSkinTest.java \
                  STATUS.md \
                  decisions/security-review-2026-09-06.md
          git diff --cached --check
          git commit -m 'Remember explicitly selected people across loads'
          git push origin HEAD:fix/remember-selected-person-0.12.1
