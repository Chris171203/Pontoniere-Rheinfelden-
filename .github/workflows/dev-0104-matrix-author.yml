name: PFVR 0.10.4 shared participant matrix

on:
  push:
    branches:
      - dev-0.10.4-matrix-author

permissions:
  contents: write

jobs:
  author-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared matrix source changes
        run: python3 tools/author_0104_matrix.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests and APK
        working-directory: Android
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify package and stable signature
        shell: bash
        run: |
          set -euo pipefail
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app.test' versionCode='28' versionName='0.10.4'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | grep -F '0521e6bc43e2868177609dea69d074ed14bb594bad28adee98293e586d3d46bf'

      - name: Commit exact source to target branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/InternalAttendanceSkin.java Android/app/src/test/java/ch/pfvr/internapp/InternalAttendanceSkinTest.java Android/CHANGELOG.md STATUS.md
          git commit -m 'Use shared participant columns across attendance days in 0.10.4'
          git push origin HEAD:dev-0.10.4

      - name: Remove temporary author branch
        if: always()
        shell: bash
        run: git push origin --delete dev-0.10.4-matrix-author || true
