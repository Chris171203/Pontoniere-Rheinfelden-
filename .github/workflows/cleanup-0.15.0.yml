name: Reviewed 0.15.0 branch cleanup

on:
  push:
    branches: [main]
    paths: ['tools/cleanup-0.15.0.json', 'tools/cleanup-0.15.0.py', '.github/workflows/cleanup-0.15.0.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-0.15.0
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only reviewed unchanged refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cleanup-0.15.0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PFVR-cleanup-0.15.0-${{ github.run_number }}
          path: artifacts/cleanup-0.15.0.json
