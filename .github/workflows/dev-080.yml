name: Dev Android 0.8.0

on:
  push:
    branches:
      - dev-0.8.0

permissions:
  contents: read

concurrency:
  group: pfvr-dev-080
  cancel-in-progress: true

jobs:
  bootstrap-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.8.0

      - name: Materialize verified 0.7.1 source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_071.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'text, count = pattern.subn(river_method + "\\n", text, count=1)':
                  'text, count = pattern.subn(lambda _: river_method + "\\n", text, count=1)',
              'text, count = chart_pattern.subn(chart_block + "\\n", text, count=1)':
                  'text, count = chart_pattern.subn(lambda _: chart_block + "\\n", text, count=1)',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Patch-script anchor missing: {old}')
          path.write_text(text, encoding='utf-8')
          PY
          SRC=Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          if grep -q "versionName '0.7.1'" Android/app/build.gradle \
             && grep -q 'TWINT-Code erzeugen' "$SRC" \
             && grep -q 'class AxisScale' "$SRC"; then
            echo '0.7.1 source already materialized'
          else
            python tools/apply_071.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-source-materialized-0.7.1
          path: |
            Android
            PROJECT.md
            STATUS.md
            README.md
            AGENTS.md
            tools
          if-no-files-found: error

  probe-public-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public PFVR calendar
        run: |
          mkdir -p probe
          curl --fail --silent --show-error --location \
            'https://calendar.google.com/calendar/ical/a8mtko83nd27vsvp4i1cnpt3gs%40group.calendar.google.com/public/basic.ics' \
            -o probe/calendar.ics
          grep -q 'BEGIN:VCALENDAR' probe/calendar.ics

      - name: Fetch BAFU live, 10-minute and hourly samples
        run: |
          mkdir -p probe
          FROM_24H=$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          FROM_7D=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          cat > probe/query.graphql <<EOF
          {
            water {
              observations {
                data_live(where:{stationNo:{_eq:"2091"}}) {
                  stationNo parameterName timestamp value releaseStatus
                }
                data_10min_mean(where:{station:{no:{_eq:"2091"}},timestamp:{_gte:"$FROM_24H"}}) {
                  parameterName timestamp value unitSymbol
                }
                data_1hour_mean(where:{station:{no:{_eq:"2091"}},timestamp:{_gte:"$FROM_7D"}}) {
                  parameterName timestamp value unitSymbol
                }
              }
            }
          }
          EOF
          jq -Rs '{query:.}' probe/query.graphql > probe/request.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @probe/request.json \
            https://data.bafu.admin.ch/api \
            -o probe/hydro.json
          jq -e '.data.water.observations.data_live | length > 0' probe/hydro.json
          jq -e '.data.water.observations.data_10min_mean | length > 0' probe/hydro.json
          jq -e '.data.water.observations.data_1hour_mean | length > 0' probe/hydro.json
          jq '{live:(.data.water.observations.data_live|length), ten_min:(.data.water.observations.data_10min_mean|length), hourly:(.data.water.observations.data_1hour_mean|length)}' probe/hydro.json

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-public-source-probe-0.8.0
          path: probe
          if-no-files-found: error
