name: Temporary 0.11.5 documentation update

on:
  push:
    branches: [dev-0.11.5-safety]
    paths: ['.github/workflows/tmp-0115-docs.yml']

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.11.5-safety
      - name: Update 0.11.5 documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, got {n}')
              return text.replace(old,new,1)

          # CHANGELOG
          p=Path('Android/CHANGELOG.md'); s=p.read_text()
          entry='''## 0.11.5\n- Sicherheitsreview gegen die Opus-Analyse umgesetzt: Die aktuelle Schifffahrtslage aus Basel-Rheinhalle wird nur noch aus Messwert und Cache mit höchstens 60 Minuten Alter abgeleitet. Danach zeigt die App `Lage unklar` statt eine vermeintlich aktuelle Normal-/Sperrstufe.\n- `Rhein aktuell` nennt Datum und Uhrzeit des Messstands und weist ausdrücklich darauf hin, dass BAFU-Aktuellwerte ungeprüfte Rohdaten sind; die App ist keine amtliche Freigabe und verweist auf die Schweizerischen Rheinhäfen als massgebende Stelle. Rheinfelden bleibt ohne künstliche lokale `NORMAL`-Stufe neutral eingefärbt.\n- Die interne Personenansicht stellt lokal gespeicherte, serverseitig fehlende Zusatzpersonen nicht mehr still beim Seitenaufbau wieder her. Eine Wiederherstellung wird nur noch nach ausdrücklicher Nutzeraktion in `Personen verwalten` angestossen.\n- Der persönliche Intern-Basislink wird nicht mehr als globale `window.__pfvrBaseInternalUrl`-Variable in den Seitenkontext geschrieben. Externe App-Links werden zentral auf `http`, `https`, `mailto`, `tel` und `geo` begrenzt.\n- Zielarchitektur für zentral aktuelle Preise/IBAN und eine spätere authentifizierte interne JSON-API in `decisions/runtime-config-and-internal-api.md` dokumentiert. Die vollständige Bewertung der Opus-Analyse liegt in `docs/opus-review-2026-09-06.md`.\n- Versionsstand `0.11.5`, `versionCode 52`.\n\n'''
          s=once(s,'# Android Changelog\n\n## 0.11.4','# Android Changelog\n\n'+entry+'## 0.11.4','changelog')
          p.write_text(s)

          # Android README
          p=Path('Android/README.md'); s=p.read_text()
          s=once(s,'Aktuelle Android-Testversion: `0.11.4` (`versionCode 51`).','Aktuelle Android-Testversion: `0.11.5` (`versionCode 52`).','android version')
          s=s.replace('## Play-Store-Readiness 0.11.4','## Play-Store-Readiness 0.11.5')
          s=once(s,'- Die offizielle Schifffahrtslage richtet sich ausschließlich nach dem Pegel Basel-Rheinhalle: 700 cm = HWM I/Voralarm, 790 cm = HWM IIb/Sperrung Kleinschifffahrt und Fähren Basel–Rheinfelden, 820 cm = HWM IIa/Sperrung Rheinfelden–Kembs.\n- Der Abfluss bleibt ein eigener hydrologischer Messwert und steuert keine offizielle Sperrstufe.',
          '- Die Schifffahrtslage wird aus dem Pegel Basel-Rheinhalle abgeleitet: 700 cm = HWM I/Voralarm, 790 cm = HWM IIb/Sperrung Kleinschifffahrt und Fähren Basel–Rheinfelden, 820 cm = HWM IIa/Sperrung Rheinfelden–Kembs. Für die **aktuelle** Stufe müssen Messwert und Live-Cache höchstens 60 Minuten alt sein; sonst zeigt die App `Lage unklar`.\n- BAFU-Aktuellwerte sind ungeprüfte Rohdaten und können Fehler enthalten. Die App weist deshalb ausdrücklich darauf hin, dass ihre Lageanzeige der Orientierung dient und keine amtliche Freigabe ersetzt; massgebend sind die Schweizerischen Rheinhäfen.\n- Der Abfluss bleibt ein eigener hydrologischer Messwert und steuert keine offizielle Sperrstufe. Rheinfelden erhält keine künstliche lokale `NORMAL`-Stufe, sondern bleibt neutral eingefärbt.','river docs')
          s=once(s,'- `Aus Initiallink neu aufbauen` löscht nur lokale Personen-/Restore-Zustände und lädt den gespeicherten persönlichen Initiallink erneut.\n- Website-Bulk-Aktionen wie `Alle anzeigen` sind im App-Modus blockiert; im unveränderten Originalmodus können sie bewusst verwendet werden.',
          '- `Aus Initiallink neu aufbauen` löscht nur lokale Personen-/Restore-Zustände und lädt den gespeicherten persönlichen Initiallink erneut.\n- Lokal gespeicherte Zusatzpersonen, die auf der aktuellen Serveransicht fehlen, werden **nicht automatisch** zurückgeschrieben. Die Wiederherstellung kann nur ausdrücklich über `Personen verwalten` angestossen werden.\n- Website-Bulk-Aktionen wie `Alle anzeigen` sind im App-Modus blockiert; im unveränderten Originalmodus können sie bewusst verwendet werden.','restore docs')
          s=s.replace('## Gerätetest 0.11.4','## Gerätetest 0.11.5')
          s=once(s,'- `Rhein aktuell`: Der Pegel ist wieder die größere Hauptgröße. Basel muss abhängig von seiner aktuellen Hochwasserstufe Pegelwert und Lage-Badge passend einfärben; der Abfluss bleibt kleiner und farblich unterscheidbar. Rheinfelden bleibt ohne erfundene lokale Sperrstufe neutral.',
          '- `Rhein aktuell`: Der Pegel ist wieder die größere Hauptgröße. Basel muss abhängig von seiner aktuellen Hochwasserstufe Pegelwert und Lage-Badge passend einfärben; der Abfluss bleibt kleiner und farblich unterscheidbar. Rheinfelden bleibt ohne erfundene lokale Sperrstufe neutral. Ein Basel-Messwert oder Live-Cache älter als 60 Minuten muss `Lage unklar` ergeben; der Messstand muss Datum und Uhrzeit zeigen.','device stale test')
          s=once(s,'- `Personen`: Hinzufügen, Entfernen und Neuaufbau aus Initiallink auch nach App-Neustart prüfen.',
          '- `Personen`: Hinzufügen, Entfernen und Neuaufbau aus Initiallink auch nach App-Neustart prüfen. Eine auf dem Server fehlende, lokal gespeicherte Zusatzperson darf beim normalen Öffnen nicht automatisch wieder angelegt werden; Wiederherstellung muss eine sichtbare Nutzeraktion erfordern.','device restore test')
          s=once(s,'Debug-Testpakete verwenden `ch.pfvr.app.test` und seit 0.9.5 einen festen, bewusst öffentlichen Testschlüssel im Repository. Damit sind spätere Test-APKs bei steigendem `versionCode` überinstallierbar. Der Testschlüssel darf niemals für `ch.pfvr.app` oder einen Store-Release verwendet werden; die Produktionssignierung bleibt geheim und separat.',
          'Debug-Testpakete verwenden `ch.pfvr.app.test` und seit 0.9.5 einen festen, bewusst öffentlichen Testschlüssel im Repository. Damit sind spätere Test-APKs bei steigendem `versionCode` überinstallierbar. **Jeder mit diesem öffentlichen Schlüssel könnte jedoch ebenfalls eine manipulierte `.test`-APK als technisch gültiges Update signieren.** Test-APKs deshalb nur aus dem eigenen zugehörigen CI-Run installieren und die bereitgestellte SHA-256-Prüfsumme abgleichen; für reguläre Tester ist Google Play Internal Testing vorzuziehen. Der Testschlüssel darf niemals für `ch.pfvr.app` oder einen Store-Release verwendet werden; die Produktionssignierung bleibt geheim und separat.','test key risk')
          p.write_text(s)

          # Root README
          p=Path('README.md'); s=p.read_text()
          s=s.replace('Aktueller Android-Teststand: `0.11.4`.','Aktueller Android-Teststand: `0.11.5`.')
          marker='Schwerpunkte des aktuellen Stands:\n\n'
          if marker in s and 'Sicherheitsreview 0.11.5' not in s:
              s=s.replace(marker,marker+'- Sicherheitsreview 0.11.5: veraltete Basel-Pegeldaten führen nach 60 Minuten zu `Lage unklar`, BAFU-Rohdatenhinweis/amtliche Quelle sind sichtbar, stille Personen-Wiederherstellung wurde durch eine explizite Aktion ersetzt und externe URI-Schemata wurden gehärtet;\n',1)
          p.write_text(s)

          # STATUS
          p=Path('STATUS.md'); s=p.read_text()
          s=s.replace('Stand: Testversion `0.11.4` · aktualisiert 2026-09-04.','Stand: Testversion `0.11.5` · aktualisiert 2026-09-06.')
          marker='## Aktueller Teststand\n\n'
          block='''- `0.11.5` setzt das Sicherheitsreview der Opus-Analyse um. Die zwei materiellen Befunde waren belastbar: eine aktuelle Schifffahrtslage durfte bislang aus beliebig altem Basel-Cache entstehen, und lokal gewünschte Zusatzpersonen konnten ohne neuen Nutzerklick über echte Website-Controls wiederhergestellt werden.\n- Für die aktuelle Basel-Schifffahrtslage gelten jetzt maximal 60 Minuten Datenalter für Messwert **und** Live-Cache. Danach wird `Lage unklar` angezeigt. Der Messstand enthält Datum/Uhrzeit; ein sichtbarer Hinweis erklärt die BAFU-Aktuellwerte als ungeprüfte Rohdaten und verlinkt auf die Schweizerischen Rheinhäfen als massgebende Stelle. Rheinfelden bleibt ohne eigene erfundene Normal-/Sperrstufe neutral.\n- Fehlende lokal gespeicherte Zusatzpersonen werden nicht mehr still beim Seitenaufbau angelegt. Eine Restore-Sequenz startet nur nach ausdrücklicher Aktion in `Personen verwalten`. Der Intern-Basislink ist nicht mehr als globale JS-Window-Variable exponiert; externe URI-Schemata sind auf `http/https/mailto/tel/geo` begrenzt.\n- Für zentral aktuelle IBAN, Zahlungsempfänger, Preise und weitere Betriebsparameter ist eine versionierte HTTPS-Laufzeitkonfiguration mit Cache, Gültigkeitsfenster und fail-safe Zahlungslogik geplant. Personenbezogene interne Funktionen sollen langfristig über eine getrennte authentifizierte API laufen; die Original-WebView bleibt bis dahin Referenz/Fallback. Details: `decisions/runtime-config-and-internal-api.md`.\n- Vollständige Bewertung inkl. bewusst nicht prüfbarer Serverpunkte: `docs/opus-review-2026-09-06.md`.\n'''
          if marker in s and block not in s: s=s.replace(marker,marker+block,1)
          p.write_text(s)

          # PlayStore README version/reference
          p=Path('PlayStore/README.md'); s=p.read_text()
          s=s.replace('Stand: Android-Testversion `0.11.4` (`versionCode 51`)','Stand: Android-Testversion `0.11.5` (`versionCode 52`)')
          s=s.replace('`0.11.4` bzw. einen daraus abgeleiteten `0.11.x`-Stand','`0.11.5` bzw. einen daraus abgeleiteten `0.11.x`-Stand')
          p.write_text(s)
          PY
      - name: Commit documentation
        run: |
          git config user.name 'PFVR maintenance'
          git config user.email '126019214+Chris171203@users.noreply.github.com'
          git add Android/CHANGELOG.md Android/README.md README.md STATUS.md PlayStore/README.md
          git commit -m 'Document 0.11.5 safety hardening'
          git push origin HEAD:dev-0.11.5-safety
