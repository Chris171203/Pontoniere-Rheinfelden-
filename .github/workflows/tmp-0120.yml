name: Temporary 0.12.0 internal view polish

on:
  push:
    branches:
      - release/0.12.0-internal-polish
    paths:
      - .github/workflows/tmp-0120.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.12.0-internal-polish

      - name: Tighten App-Ansicht readiness check
        run: python3 .github/tmp-0120.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests, lint and debug build
        working-directory: Android
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleDebug

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java \
                  Android/app/src/test/java/ch/pfvr/internapp/InternalAppViewSourceTest.java
          git diff --cached --check
          git commit -m 'Wait for completed attendance matrix before reveal'
          git push origin HEAD:release/0.12.0-internal-polish
