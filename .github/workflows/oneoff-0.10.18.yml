name: One-off Android 0.10.18 graph unit selector

on:
  push:
    branches:
      - dev-0.10.18
    paths:
      - '.github/workflows/oneoff-0.10.18.yml'

permissions:
  contents: write

jobs:
  apply-source-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.18

      - name: Add selectable Rhein graph level unit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Centralise absolute-vs-relative level presentation.
          river = Path('Android/app/src/main/java/ch/pfvr/internapp/RiverDisplay.java')
          text = river.read_text(encoding='utf-8')
          insert = '''\n    static double graphLevelValue(HydroStation station,double rawMetresAboveSea,boolean centimetres){\n        return centimetres?gaugeCentimetres(station,rawMetresAboveSea):levelValue(station,rawMetresAboveSea);\n    }\n\n    static String graphLevelUnit(boolean centimetres){\n        return centimetres?"cm":"m ü.M.";\n    }\n\n    static int graphLevelDecimals(boolean centimetres){\n        return centimetres?0:2;\n    }\n'''
          marker = '''    static double gaugeCentimetres(HydroStation station,double rawMetresAboveSea){'''
          if marker not in text:
              raise SystemExit('RiverDisplay gauge marker not found')
          text = text.replace(marker, insert + '\n' + marker, 1)
          river.write_text(text, encoding='utf-8')

          # Extend unit tests for both graph modes.
          test = Path('Android/app/src/test/java/ch/pfvr/internapp/RiverDisplayTest.java')
          t = test.read_text(encoding='utf-8')
          marker = '''    @Test public void preservesMissingValues(){'''
          addition = '''    @Test public void graphModeSwitchesBetweenAbsoluteMetresAndRelativeCentimetres(){\n        assertEquals(247.20, RiverDisplay.graphLevelValue(HydroStation.BASEL_RHEINHALLE,247.20,false), 0.0001);\n        assertEquals(720.0, RiverDisplay.graphLevelValue(HydroStation.BASEL_RHEINHALLE,247.20,true), 0.0001);\n        assertEquals(261.30, RiverDisplay.graphLevelValue(HydroStation.RHEINFELDEN,261.30,false), 0.0001);\n        assertEquals(130.0, RiverDisplay.graphLevelValue(HydroStation.RHEINFELDEN,261.30,true), 0.0001);\n        assertEquals("m ü.M.", RiverDisplay.graphLevelUnit(false));\n        assertEquals("cm", RiverDisplay.graphLevelUnit(true));\n        assertEquals(2, RiverDisplay.graphLevelDecimals(false));\n        assertEquals(0, RiverDisplay.graphLevelDecimals(true));\n    }\n\n'''
          if marker not in t:
              raise SystemExit('RiverDisplayTest marker not found')
          t = t.replace(marker, addition + marker, 1)
          test.write_text(t, encoding='utf-8')

          path = Path('Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java')
          text = path.read_text(encoding='utf-8')

          # Persist a global graph unit selection; summary cards stay absolute m ü.M. plus small cm.
          old = '    private static final String PREF_RIVER_RANGE = "river_range";\n'
          new = old + '    private static final String PREF_RIVER_GRAPH_LEVEL_UNIT = "river_graph_level_unit";\n'
          if old not in text:
              raise SystemExit('river range pref marker not found')
          text = text.replace(old, new, 1)

          old = '''private View homeRiverChartsTile(){\n    LinearLayout group=tileGroup("Rhein-Grafiken","Abfluss und Pegel je Station; Temperatur separat");\n    TextView rangeLabel=txt("ZEITRAUM",10,MUTED,true);\n    rangeLabel.setPadding(dp(2),0,0,dp(5));\n    group.addView(rangeLabel);\n    group.addView(riverRangeSelector(riverRange()),new LinearLayout.LayoutParams(-1,dp(42)));\n    boolean secondRiver=riverSlotEnabled(2);\n    addRiverStationCharts(group,1,!secondRiver);\n    if(secondRiver)addRiverStationCharts(group,2,true);\n    return group;\n}\n'''
          new = '''private View homeRiverChartsTile(){\n    LinearLayout group=tileGroup("Rhein-Grafiken","Abfluss und Pegel je Station; Temperatur separat");\n    TextView rangeLabel=txt("ZEITRAUM",10,MUTED,true);\n    rangeLabel.setPadding(dp(2),0,0,dp(5));\n    group.addView(rangeLabel);\n    group.addView(riverRangeSelector(riverRange()),new LinearLayout.LayoutParams(-1,dp(42)));\n    TextView levelUnitLabel=txt("PEGEL-EINHEIT",10,MUTED,true);\n    levelUnitLabel.setPadding(dp(2),dp(9),0,dp(5));\n    group.addView(levelUnitLabel);\n    group.addView(riverGraphLevelUnitSelector(),new LinearLayout.LayoutParams(-1,dp(42)));\n    boolean secondRiver=riverSlotEnabled(2);\n    addRiverStationCharts(group,1,!secondRiver);\n    if(secondRiver)addRiverStationCharts(group,2,true);\n    return group;\n}\n'''
          if old not in text:
              raise SystemExit('homeRiverChartsTile block not found')
          text = text.replace(old, new, 1)

          # Graph current values follow the selected graph unit, independent of summary-card display.
          old = '        double levelNow=displayHydroValue(station,RiverMetric.LEVEL,currentHydroValue(station,"W"));\n'
          new = '        double levelNow=graphLevelValue(station,currentHydroValue(station,"W"));\n'
          if old not in text:
              raise SystemExit('combined card levelNow marker not found')
          text = text.replace(old, new, 1)

          old = '        TextView w=txt(Double.isFinite(levelNow)?formatMetric(station,RiverMetric.LEVEL,levelNow)+" "+metricUnit(station,RiverMetric.LEVEL):"–",18,WATER,true);\n'
          new = '        TextView w=txt(Double.isFinite(levelNow)?formatGraphLevel(levelNow)+" "+graphLevelUnit():"–",18,WATER,true);\n'
          if old not in text:
              raise SystemExit('combined card level text marker not found')
          text = text.replace(old, new, 1)

          old = '            TextView hint=txt("Abfluss links · Pegel rechts · Diagramm berühren für Einzelwerte",10,MUTED,false);\n'
          new = '            TextView hint=txt("Abfluss links · Pegel rechts ("+graphLevelUnit()+") · Diagramm berühren für Einzelwerte",10,MUTED,false);\n'
          if old not in text:
              raise SystemExit('graph hint marker not found')
          text = text.replace(old, new, 1)

          # Add selector and graph-specific formatting helpers next to the timeframe selector.
          marker = '''    private LinearLayout segmentedBackground(){'''
          helpers = '''    private boolean riverGraphLevelCentimetres(){\n        return "cm".equals(prefs.getString(PREF_RIVER_GRAPH_LEVEL_UNIT,"m"));\n    }\n\n    private View riverGraphLevelUnitSelector(){\n        LinearLayout outer=segmentedBackground();\n        boolean centimetres=riverGraphLevelCentimetres();\n        TextView absolute=segmentOption("m ü.M.",!centimetres);\n        absolute.setContentDescription("Pegel im Diagramm in Meter über Meer");\n        absolute.setOnClickListener(v->{\n            prefs.edit().putString(PREF_RIVER_GRAPH_LEVEL_UNIT,"m").apply();\n            if(current==Screen.HOME)refreshHomeLiveViews();\n        });\n        outer.addView(absolute,segmentParams(outer));\n        TextView relative=segmentOption("cm",centimetres);\n        relative.setContentDescription("Pegel im Diagramm in Zentimetern");\n        relative.setOnClickListener(v->{\n            prefs.edit().putString(PREF_RIVER_GRAPH_LEVEL_UNIT,"cm").apply();\n            if(current==Screen.HOME)refreshHomeLiveViews();\n        });\n        outer.addView(relative,segmentParams(outer));\n        return outer;\n    }\n\n    private double graphLevelValue(HydroStation station,double rawValue){\n        return RiverDisplay.graphLevelValue(station,rawValue,riverGraphLevelCentimetres());\n    }\n\n    private String graphLevelUnit(){\n        return RiverDisplay.graphLevelUnit(riverGraphLevelCentimetres());\n    }\n\n    private String formatGraphLevel(double value){\n        if(!Double.isFinite(value))return "–";\n        return RiverDisplay.graphLevelDecimals(riverGraphLevelCentimetres())==0\n                ?String.format(Locale.GERMAN,"%.0f",value)\n                :String.format(Locale.GERMAN,"%.2f",value);\n    }\n\n'''
          if marker not in text:
              raise SystemExit('segmented background marker not found')
          text = text.replace(marker, helpers + marker, 1)

          # Convert the W series according to the graph setting.
          old = '''        if("W".equals(parameter)){\n            for(int index=0;index<result.values.size();index++){\n                result.values.set(index,RiverDisplay.levelValue(station,result.values.get(index)));\n            }\n        }\n'''
          new = '''        if("W".equals(parameter)){\n            for(int index=0;index<result.values.size();index++){\n                result.values.set(index,graphLevelValue(station,result.values.get(index)));\n            }\n        }\n'''
          if old not in text:
              raise SystemExit('hydroSeries W conversion block not found')
          text = text.replace(old, new, 1)

          # Tooltip follows the selected level unit too.
          old = '            String text=time.format(formatter)+" · "+formatMetric(station,RiverMetric.FLOW,q)+" m³/s · "+formatMetric(station,RiverMetric.LEVEL,w)+" "+metricUnit(station,RiverMetric.LEVEL);\n'
          new = '            String text=time.format(formatter)+" · "+formatMetric(station,RiverMetric.FLOW,q)+" m³/s · "+formatGraphLevel(w)+" "+graphLevelUnit();\n'
          if old not in text:
              raise SystemExit('dual graph tooltip marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          # Version bump.
          gradle = Path('Android/app/build.gradle')
          build = gradle.read_text(encoding='utf-8')
          build = build.replace('versionCode 41','versionCode 42',1)
          build = build.replace("versionName '0.10.17'","versionName '0.10.18'",1)
          gradle.write_text(build, encoding='utf-8')

          # Changelog.
          changelog = Path('Android/CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          entry = '''# Android Changelog\n\n## 0.10.18\n- In `Rhein-Grafiken` kann die Pegelachse global zwischen `m ü.M.` und `cm` umgeschaltet werden. Die Auswahl wird lokal gespeichert und gilt für beide Messstationen.\n- Aktueller Pegelwert im Diagrammkopf, rechte Pegelachse, Kurve, Tooltip und Hinweistext verwenden gemeinsam die ausgewählte Einheit.\n- `Rhein aktuell` bleibt davon unabhängig: Beide Stationen zeigen dort primär den absoluten Wasserstand in `m ü.M.` und darunter klein den relativen Pegel in `cm`.\n\n'''
          if current.startswith('# Android Changelog\n\n'):
              current = entry + current[len('# Android Changelog\n\n'):]
          else:
              current = entry + current
          changelog.write_text(current, encoding='utf-8')

          # README/version description.
          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace('Android-Testversion `0.10.15` auf `main`.', 'Android-Testversion `0.10.18` auf `main`.', 1)
          r = r.replace('BAFU-Rheindaten mit Abfluss, stationsgerechtem Pegel, Wassertemperatur und interaktiven Verläufen; Basel-Rheinhalle wird als operativer Pegel in cm dargestellt;', 'BAFU-Rheindaten mit Abfluss, Wasserstand, Wassertemperatur und interaktiven Verläufen; beide Kurzwerte zeigen m ü.M. plus cm, die Graphen lassen die Pegel-Einheit umschalten;', 1)
          readme.write_text(r, encoding='utf-8')

          # STATUS current section.
          status = Path('STATUS.md')
          st = status.read_text(encoding='utf-8')
          st = st.replace('Stand: Testversion `0.10.16`', 'Stand: Testversion `0.10.18`', 1)
          anchor = '- Die beiden Rhein-Kurzkarten werden auf dieselbe Höhe gebracht; ein flexibler Restbereich drückt den BAFU-Stand/Zeitstempel jeweils an den unteren Kartenrand, sodass beide Zeitangaben auf derselben Linie liegen.\n'
          extra = anchor + '- In `Rhein-Grafiken` gibt es einen persistenten Einheitenumschalter `m ü.M.` / `cm`. Er steuert beide Stationen gleichzeitig sowie Pegelwert, rechte Achse, Kurve und Einzelwert-Tooltip; Standard bleibt `m ü.M.`.\n'
          if anchor in st:
              st = st.replace(anchor, extra, 1)
          st = st.replace('- Zusätzliche Tests prüfen die Basel-Rheinhalle-Umrechnung von absolutem BAFU-Wasserstand auf den operativen Pegel in Zentimetern einschließlich Einheit und Rundung.\n', '- Zusätzliche Tests prüfen absolute Wasserstände, relative cm-Pegel für Basel und Rheinfelden sowie beide Darstellungsmodi der Graphen.\n', 1)
          status.write_text(st, encoding='utf-8')
          PY

      - name: Commit direct source changes
        shell: bash
        run: |
          rm .github/workflows/oneoff-0.10.18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add selectable Rhein graph level unit'
          git push origin HEAD:dev-0.10.18
