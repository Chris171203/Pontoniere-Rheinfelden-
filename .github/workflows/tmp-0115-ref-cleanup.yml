name: Temporary documentation reference cleanup
on:
  push:
    branches: [dev-0.11.5-safety]
    paths: ['.github/workflows/tmp-0115-ref-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.11.5-safety
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['Android/CHANGELOG.md','STATUS.md']:
              p=Path(name); s=p.read_text()
              s=s.replace('decisions/runtime-config-and-internal-api.md','decisions/app-config-and-internal-api.md')
              s=s.replace('docs/opus-review-2026-09-06.md','decisions/security-review-2026-09-06.md')
              p.write_text(s)
          PY
          git config user.name 'PFVR maintenance'
          git config user.email '126019214+Chris171203@users.noreply.github.com'
          git add Android/CHANGELOG.md STATUS.md
          git commit -m 'Align 0.11.5 docs with existing architecture reviews'
          git push origin HEAD:dev-0.11.5-safety
