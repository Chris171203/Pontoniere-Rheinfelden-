name: PFVR 0.9.8 QR filename author

on:
  push:
    branches: [dev-0.9.8-author]

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply QR filename source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java')
          s=p.read_text()
          old1='File file=new File(directory,value.isBlank()?"PFVR-Zahlung-offen.png":"PFVR-Zahlung-CHF-"+value.replace(\'.\',\'_\')+".png");'
          new1='File file=new File(directory,PaymentQrFileName.forAmount(value));'
          old2='save.putExtra(Intent.EXTRA_TITLE,amount.isBlank()?"PFVR-Zahlung-offener-Betrag.png":"PFVR-Zahlung-CHF-"+amount.replace(\'.\',\'_\')+".png");'
          new2='save.putExtra(Intent.EXTRA_TITLE,PaymentQrFileName.forAmount(amount));'
          if s.count(old1)!=1:
              raise SystemExit(f'temp filename source match count={s.count(old1)}')
          if s.count(old2)!=1:
              raise SystemExit(f'save filename source match count={s.count(old2)}')
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY

      - name: Commit exact source to target branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          git commit -m "Use reusable PFVR QR filenames"
          git push origin HEAD:dev-0.9.8

      - name: Remove temporary author branch
        if: always()
        shell: bash
        run: git push origin --delete dev-0.9.8-author || true
