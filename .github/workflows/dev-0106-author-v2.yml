name: Author PFVR 0.10.6 v2

on:
  push:
    branches:
      - dev-0.10.6-author

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.6-author
          fetch-depth: 0
      - name: Apply patch
        run: python tools/author_patch_0106.py
      - name: Publish clean target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PFVR Build Author"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/dev-0106-author.yml .github/workflows/dev-0106-author-v2.yml tools/author_patch_0106.py
          git add Android/app/src/main/java/ch/pfvr/internapp/InternalAttendanceSkin.java Android/app/src/test/java/ch/pfvr/internapp/InternalAttendanceSkinTest.java Android/app/build.gradle Android/README.md Android/CHANGELOG.md STATUS.md
          git diff --cached --check
          git commit -m "fix: preserve website context when adding people"
          git push origin HEAD:dev-0.10.6
          git push origin --delete dev-0.10.6-author || true
