name: Author PFVR 0.10.7

on:
  push:
    branches:
      - dev-0.10.7-author
    paths:
      - 'tools/apply_0107.py'
      - '.github/workflows/dev-0107-author.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_0107.py')
          text = path.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if old not in text:
              raise SystemExit('temporary patch runner line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/apply_0107.py
      - name: Publish clean target branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_0107.py .github/workflows/dev-0107-author.yml
          git config user.name 'PFVR Build Author'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: trust current website participant rows'
          git push --force origin HEAD:refs/heads/dev-0.10.7
