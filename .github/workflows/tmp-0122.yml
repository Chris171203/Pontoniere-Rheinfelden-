name: Temporary 0.12.2 cart persistence and weather slots

on:
  push:
    branches:
      - feature/cart-persistence-weather-slots-0.12.2
    paths:
      - .github/workflows/tmp-0122.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cart-persistence-weather-slots-0.12.2

      - name: Apply corrected staged source patch
        run: |
          python3 .github/tmp-0122.py
          python3 .github/tmp-0122-fix.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests, lint and debug build
        working-directory: Android
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleDebug

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/build.gradle \
                  Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java \
                  Android/app/src/main/java/ch/pfvr/internapp/WeatherDaily.java \
                  Android/app/src/main/java/ch/pfvr/internapp/CashCartState.java \
                  Android/app/src/test/java/ch/pfvr/internapp/WeatherDailyTest.java \
                  Android/app/src/test/java/ch/pfvr/internapp/WeatherForecastSourceTest.java \
                  Android/app/src/test/java/ch/pfvr/internapp/CashCartStateTest.java \
                  Android/app/src/test/java/ch/pfvr/internapp/CashCartPersistenceSourceTest.java \
                  PROJECT.md STATUS.md
          git diff --cached --check
          git commit -m 'Persist cart and add 10 14 18 weather slots'
          git push origin HEAD:feature/cart-persistence-weather-slots-0.12.2
