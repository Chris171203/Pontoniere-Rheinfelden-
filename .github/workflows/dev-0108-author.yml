name: Author PFVR 0.10.8

on:
  push:
    branches:
      - dev-0.10.8-author
    paths:
      - 'tools/apply_0108.py'
      - '.github/workflows/dev-0108-author.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: python tools/apply_0108.py
      - name: Publish clean target branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_0108.py .github/workflows/dev-0108-author.yml
          git config user.name 'PFVR Build Author'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make person management explicit and robust'
          git push --force origin HEAD:refs/heads/dev-0.10.8
