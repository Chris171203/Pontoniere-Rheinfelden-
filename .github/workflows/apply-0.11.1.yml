name: Apply Android 0.11.1 language and access gate

on:
  push:
    branches:
      - dev-0.11.1
    paths:
      - '.github/workflows/apply-0.11.1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.11.1
      - name: Apply source and metadata changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{path}: expected text not found: {old[:120]!r}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          main='Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java'
          p=Path(main)
          s=p.read_text(encoding='utf-8')

          old='''    private static final String PREF_INTERNAL_APP_VIEW = "internal_app_view";\n    private static final String PREF_BACKGROUND_REFRESH = "background_refresh";'''
          new='''    private static final String PREF_INTERNAL_APP_VIEW = "internal_app_view";\n    private static final String PREF_LANGUAGE = "ui_language";\n    private static final String PREF_ACCESS_UNLOCKED = "access_unlocked_v1";\n    private static final String PREF_BACKGROUND_REFRESH = "background_refresh";'''
          if old not in s: raise SystemExit('MainActivity prefs anchor missing')
          s=s.replace(old,new,1)

          old='''    @Override protected void onCreate(Bundle state) {\n        super.onCreate(state);\n        prefs = getSharedPreferences(PREFS, MODE_PRIVATE);\n        tileLayoutStore = new TileLayoutStore(prefs);\n        dataRefreshHandler = new Handler(Looper.getMainLooper());\n        scheduleBackgroundRefresh();\n        darkMode = resolveDarkMode();\n        loadCachedEvents();\n        loadCachedNews();\n        applyWindowTheme();\n        setContentView(buildShell());\n        navigate(Screen.HOME);\n        refreshEvents(false, () -> {\n            if (current == Screen.HOME) rebuildHomePreservingScroll();\n            else if (current == Screen.EVENTS) navigate(Screen.EVENTS);\n        });\n        refreshNews(false);\n        refreshLive(false);\n    }'''
          new='''    @Override protected void onCreate(Bundle state) {\n        super.onCreate(state);\n        prefs = getSharedPreferences(PREFS, MODE_PRIVATE);\n        darkMode = resolveDarkMode();\n        applyWindowTheme();\n        if(!prefs.getBoolean(PREF_ACCESS_UNLOCKED,false)){\n            showFirstUseGate();\n            return;\n        }\n        startUnlockedApp();\n    }\n\n    private void startUnlockedApp(){\n        tileLayoutStore = new TileLayoutStore(prefs);\n        dataRefreshHandler = new Handler(Looper.getMainLooper());\n        scheduleBackgroundRefresh();\n        loadCachedEvents();\n        loadCachedNews();\n        setContentView(buildShell());\n        navigate(Screen.HOME);\n        refreshEvents(false, () -> {\n            if (current == Screen.HOME) rebuildHomePreservingScroll();\n            else if (current == Screen.EVENTS) navigate(Screen.EVENTS);\n        });\n        refreshNews(false);\n        refreshLive(false);\n    }'''
          if old not in s: raise SystemExit('MainActivity onCreate anchor missing')
          s=s.replace(old,new,1)

          old='''    @Override protected void onResume(){\n        super.onResume();\n        if(prefs!=null){'''
          new='''    @Override protected void onResume(){\n        super.onResume();\n        if(prefs==null||!prefs.getBoolean(PREF_ACCESS_UNLOCKED,false))return;\n        if(prefs!=null){'''
          if old not in s: raise SystemExit('MainActivity onResume anchor missing')
          s=s.replace(old,new,1)

          anchor='''    private void scheduleBackgroundRefresh(){'''
          insert='''    private String uiMode(){\n        return UiLanguage.normalizeMode(prefs==null?UiLanguage.DE:prefs.getString(PREF_LANGUAGE,UiLanguage.DE));\n    }\n\n    private String ui(String value){\n        return UiLanguage.translate(value,uiMode());\n    }\n\n    private void setUiLanguage(String mode){\n        String normalized=UiLanguage.normalizeMode(mode);\n        if(normalized.equals(uiMode()))return;\n        prefs.edit().putString(PREF_LANGUAGE,normalized).apply();\n        recreate();\n    }\n\n    private void showFirstUseGate(){\n        LinearLayout root=new LinearLayout(this);\n        root.setOrientation(LinearLayout.VERTICAL);\n        root.setGravity(Gravity.CENTER_HORIZONTAL);\n        root.setPadding(dp(24),dp(42),dp(24),dp(32));\n        root.setBackgroundColor(themeBg(SURFACE));\n\n        ImageView logo=new ImageView(this);\n        logo.setImageResource(R.drawable.pfvr_logo);\n        logo.setScaleType(ImageView.ScaleType.CENTER_CROP);\n        logo.setBackground(round(Color.WHITE,14));\n        logo.setClipToOutline(true);\n        LinearLayout.LayoutParams logoParams=new LinearLayout.LayoutParams(dp(84),dp(84));\n        logoParams.setMargins(0,0,0,dp(18));\n        root.addView(logo,logoParams);\n\n        TextView title=txt("PFVR Rheinfelden",24,TEXT,true);\n        title.setGravity(Gravity.CENTER);\n        root.addView(title);\n        TextView subtitle=txt("Erstfreigabe",16,WATER,true);\n        subtitle.setGravity(Gravity.CENTER);\n        subtitle.setPadding(0,dp(5),0,dp(20));\n        root.addView(subtitle);\n\n        LinearLayout gate=card();\n        gate.setOrientation(LinearLayout.VERTICAL);\n        gate.setPadding(dp(18),dp(18),dp(18),dp(18));\n        root.addView(gate,new LinearLayout.LayoutParams(-1,-2));\n        gate.addView(txt("Diese App kann interne Vereinsinformationen anzeigen. Gib den Freigabecode ein.",14,TEXT,false));\n        TextView note=txt("Der Code wird nur zur lokalen Erstfreigabe geprüft. Persönliche PFVR-Links bleiben weiterhin ausschließlich auf diesem Gerät.",12,MUTED,false);\n        note.setPadding(0,dp(8),0,dp(14));\n        gate.addView(note);\n\n        EditText codeInput=new EditText(this);\n        codeInput.setSingleLine(true);\n        codeInput.setHint("XXXX-XXXX-XXXX-XXXX");\n        codeInput.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_PASSWORD);\n        codeInput.setTextColor(themeText(TEXT));\n        codeInput.setHintTextColor(themeText(MUTED));\n        codeInput.setBackground(round(Color.rgb(232,240,244),12));\n        codeInput.setPadding(dp(14),0,dp(14),0);\n        gate.addView(codeInput,new LinearLayout.LayoutParams(-1,dp(50)));\n\n        TextView error=txt("Code stimmt nicht.",12,STATUS_ALARM,true);\n        error.setVisibility(View.GONE);\n        error.setPadding(0,dp(7),0,0);\n        gate.addView(error);\n\n        Button unlock=btn("Freischalten",NAVY,Color.WHITE);\n        LinearLayout.LayoutParams unlockParams=new LinearLayout.LayoutParams(-1,dp(48));\n        unlockParams.setMargins(0,dp(12),0,0);\n        gate.addView(unlock,unlockParams);\n        unlock.setOnClickListener(v->{\n            if(!AccessGate.matches(codeInput.getText().toString())){\n                error.setVisibility(View.VISIBLE);\n                codeInput.selectAll();\n                codeInput.requestFocus();\n                return;\n            }\n            prefs.edit().putBoolean(PREF_ACCESS_UNLOCKED,true).apply();\n            startUnlockedApp();\n        });\n    }\n\n'''+anchor
          if anchor not in s: raise SystemExit('MainActivity schedule anchor missing')
          s=s.replace(anchor,insert,1)

          s=s.replace('headerBack.setContentDescription("Zurück");','headerBack.setContentDescription(ui("Zurück"));',1)

          old='''        switch(screen) {\n            case HOME: headerSubtitle.setText("Auf dem Rhein zuhause"); content.addView(home()); break;\n            case EVENTS: headerSubtitle.setText("Jahresprogramm"); content.addView(eventScreen()); break;\n            case CASH: headerSubtitle.setText("Vereinsbeiz bezahlen"); content.addView(cash()); break;\n            case CLUB: headerSubtitle.setText("Verein & Kontakt"); content.addView(club()); break;\n            case NEWS: headerSubtitle.setText("Vereinsnews"); content.addView(newsScreen()); break;\n            case SETTINGS: headerSubtitle.setText("Einstellungen"); content.addView(settings()); break;\n            case TILE_SETTINGS: headerSubtitle.setText("Kacheln anordnen"); content.addView(tileSettingsScreen()); break;\n            case INTERNAL: headerSubtitle.setText("Interner Bereich"); content.addView(internal()); break;\n        }'''
          new='''        switch(screen) {\n            case HOME: headerSubtitle.setText(ui("Auf dem Rhein zuhause")); content.addView(home()); break;\n            case EVENTS: headerSubtitle.setText(ui("Jahresprogramm")); content.addView(eventScreen()); break;\n            case CASH: headerSubtitle.setText(ui("Vereinsbeiz bezahlen")); content.addView(cash()); break;\n            case CLUB: headerSubtitle.setText(ui("Verein & Kontakt")); content.addView(club()); break;\n            case NEWS: headerSubtitle.setText(ui("Vereinsnews")); content.addView(newsScreen()); break;\n            case SETTINGS: headerSubtitle.setText(ui("Einstellungen")); content.addView(settings()); break;\n            case TILE_SETTINGS: headerSubtitle.setText(ui("Kacheln anordnen")); content.addView(tileSettingsScreen()); break;\n            case INTERNAL: headerSubtitle.setText(ui("Interner Bereich")); content.addView(internal()); break;\n        }'''
          if old not in s: raise SystemExit('MainActivity navigation switch anchor missing')
          s=s.replace(old,new,1)

          s=s.replace('mode.setText(next?"Original":"App-Ansicht")','mode.setText(ui(next?"Original":"App-Ansicht"))',1)
          s=s.replace('private void openInApp(String url,String title){headerSubtitle.setText(title);content.removeAllViews();content.addView(webScreen(url,true));}',
                      'private void openInApp(String url,String title){headerSubtitle.setText(ui(title));content.removeAllViews();content.addView(webScreen(url,true));}',1)

          old='''        theme.addView(chooseTheme,new LinearLayout.LayoutParams(-1,dp(44)));\n\n        section(body,"Persönlicher Zugang","Nur lokal auf diesem Gerät gespeichert");'''
          new='''        theme.addView(chooseTheme,new LinearLayout.LayoutParams(-1,dp(44)));\n\n        section(body,"Sprache","App-Texte; externe und originale PFVR-Inhalte bleiben unverändert");\n        LinearLayout language=card();\n        language.setOrientation(LinearLayout.VERTICAL);\n        body.addView(language,margin(-1,-2,0,0,0,12));\n        LinearLayout languageOptions=segmentedBackground();\n        boolean swissGerman=UiLanguage.isSwissGerman(uiMode());\n        TextView german=segmentOption("Deutsch",!swissGerman);\n        TextView swiss=segmentOption("Schwiizerdütsch",swissGerman);\n        german.setOnClickListener(v->setUiLanguage(UiLanguage.DE));\n        swiss.setOnClickListener(v->setUiLanguage(UiLanguage.SWISS_GERMAN));\n        languageOptions.addView(german,segmentParams(languageOptions));\n        languageOptions.addView(swiss,segmentParams(languageOptions));\n        language.addView(languageOptions,new LinearLayout.LayoutParams(-1,dp(44)));\n\n        section(body,"Persönlicher Zugang","Nur lokal auf diesem Gerät gespeichert");'''
          if old not in s: raise SystemExit('MainActivity general settings anchor missing')
          s=s.replace(old,new,1)

          old='''    private TextView txt(String s,float size,int color,boolean bold){TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(themeText(color));t.setLineSpacing(0,1.08f);if(bold)t.setTypeface(Typeface.DEFAULT_BOLD);return t;}\n    private Button btn(String s,int bg,int fg){Button b=new Button(this);b.setText(s);b.setTextSize(13);b.setTextColor(themeText(fg));b.setAllCaps(false);b.setTypeface(Typeface.DEFAULT_BOLD);b.setPadding(dp(12),0,dp(12),0);b.setMinHeight(0);b.setMinWidth(0);b.setBackground(round(bg,12));return b;}'''
          new='''    private TextView txt(String s,float size,int color,boolean bold){TextView t=new TextView(this);t.setText(ui(s));t.setTextSize(size);t.setTextColor(themeText(color));t.setLineSpacing(0,1.08f);if(bold)t.setTypeface(Typeface.DEFAULT_BOLD);return t;}\n    private Button btn(String s,int bg,int fg){Button b=new Button(this);b.setText(ui(s));b.setTextSize(13);b.setTextColor(themeText(fg));b.setAllCaps(false);b.setTypeface(Typeface.DEFAULT_BOLD);b.setPadding(dp(12),0,dp(12),0);b.setMinHeight(0);b.setMinWidth(0);b.setBackground(round(bg,12));return b;}'''
          if old not in s: raise SystemExit('MainActivity txt/btn anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          replace_required('Android/app/build.gradle',"        versionCode 47\n        versionName '0.11.0'","        versionCode 48\n        versionName '0.11.1'")
          replace_required('STATUS.md','Stand: Testversion `0.11.0` · aktualisiert 2026-09-04.','Stand: Testversion `0.11.1` · aktualisiert 2026-09-04.')
          replace_required('Android/README.md','Aktuelle Android-Testversion: `0.11.0` (`versionCode 47`).','Aktuelle Android-Testversion: `0.11.1` (`versionCode 48`).')
          replace_required('Android/README.md','## Gerätetest 0.11.0','## Gerätetest 0.11.1')
          replace_required('README.md','Android-Testversion `0.11.0` auf `main`.','Android-Testversion `0.11.1` auf `main`.')

          status=Path('STATUS.md')
          s=status.read_text(encoding='utf-8')
          marker='## Aktueller Teststand\n\n'
          addition=('## Aktueller Teststand\n\n'
                    '- Die native App-Oberfläche kann unter Einstellungen → Allgemein zwischen `Deutsch` und `Schwiizerdütsch` umgeschaltet werden. Die Umschaltung betrifft ausschließlich App-eigene Texte; externe Inhalte, Vereinsnews und die originale PFVR-Webseite bleiben unverändert.\n'
                    '- Vor dem ersten Zugriff auf die App ist eine lokale Erstfreigabe per gemeinsamem Freigabecode erforderlich. Im Repository liegt nur der SHA-256-Prüfwert, nicht der Klartextcode. Vor erfolgreicher Freigabe werden keine App-Screens, Live-Daten oder internen WebViews aufgebaut.\n')
          if marker not in s: raise SystemExit('STATUS current section missing')
          status.write_text(s.replace(marker,addition,1),encoding='utf-8')

          readme=Path('Android/README.md')
          s=readme.read_text(encoding='utf-8')
          marker='## Rheinwerte\n'
          addition=('## Sprache und Erstfreigabe\n\n'
                    '- Die native Oberfläche unterstützt `Deutsch` und `Schwiizerdütsch`. Externe/source-seitige Texte werden absichtlich nicht verändert.\n'
                    '- Beim ersten Start dieses App-Datenstands wird ein Freigabecode verlangt. Nach erfolgreicher Prüfung wird nur ein lokales Freigabe-Flag gespeichert; der Klartextcode ist nicht im Repository enthalten.\n'
                    '- Die Erstfreigabe ist eine lokale Zugangshürde und ersetzt keine serverseitige Authentifizierung. Persönliche `intern.pfvr.ch`-Links bleiben weiterhin ausschließlich auf dem Endgerät.\n\n'
                    '## Rheinwerte\n')
          if marker not in s: raise SystemExit('Android README Rheinwerte heading missing')
          readme.write_text(s.replace(marker,addition,1),encoding='utf-8')

          changelog=Path('Android/CHANGELOG.md')
          s=changelog.read_text(encoding='utf-8')
          marker='# Android Changelog\n'
          entry=('# Android Changelog\n\n'
                 '## 0.11.1\n'
                 '- Sprachumschaltung `Deutsch` / `Schwiizerdütsch` für App-eigene native UI-Texte. Externe Inhalte, Vereinsnews und die originale PFVR-Webseite werden nicht übersetzt.\n'
                 '- Lokale Erstfreigabe beim ersten App-Start. Der gemeinsam verteilte Freigabecode wird nur gegen einen eingebetteten SHA-256-Prüfwert verglichen; der Klartextcode wird nicht eingecheckt.\n'
                 '- Vor erfolgreicher Erstfreigabe werden weder die eigentliche App-Oberfläche noch Live-Daten oder interne WebViews initialisiert.\n'
                 '- Versionsstand `0.11.1`, `versionCode 48`.\n')
          if marker not in s: raise SystemExit('Changelog title missing')
          changelog.write_text(s.replace(marker,entry,1),encoding='utf-8')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android STATUS.md README.md
          git commit -m 'Add Swiss German UI and first-use access gate'
          git push origin HEAD:dev-0.11.1
