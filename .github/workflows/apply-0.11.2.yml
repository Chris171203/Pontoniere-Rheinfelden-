name: Apply Android 0.11.2 first-use gate fix

on:
  push:
    branches:
      - dev-0.11.1
    paths:
      - '.github/workflows/apply-0.11.2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.11.1
      - name: Apply source and metadata changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='''            prefs.edit().putBoolean(PREF_ACCESS_UNLOCKED,true).apply();\n            startUnlockedApp();\n        });\n    }\n\n    private void scheduleBackgroundRefresh(){'''
          new='''            prefs.edit().putBoolean(PREF_ACCESS_UNLOCKED,true).apply();\n            startUnlockedApp();\n        });\n        setContentView(root);\n    }\n\n    private void scheduleBackgroundRefresh(){'''
          if old not in s:
              raise SystemExit('MainActivity first-use gate anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('Android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=s.replace("versionCode 48\n        versionName '0.11.1'","versionCode 49\n        versionName '0.11.2'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('STATUS.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Stand: Testversion `0.11.1`','Stand: Testversion `0.11.2`',1)
          marker='## Aktueller Teststand\n\n'
          entry='- Regression der Erstfreigabe behoben: Der Freigabe-Screen wird beim ersten Start jetzt tatsächlich als Activity-Inhalt gesetzt; 0.11.1 zeigte vor der Freigabe nur den leeren Window-Hintergrund.\n'
          if entry not in s:
              s=s.replace(marker,marker+entry,1)
          p.write_text(s,encoding='utf-8')

          p=Path('Android/README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Aktuelle Android-Testversion: `0.11.1` (`versionCode 48`).','Aktuelle Android-Testversion: `0.11.2` (`versionCode 49`).',1)
          s=s.replace('## Gerätetest 0.11.1','## Gerätetest 0.11.2',1)
          p.write_text(s,encoding='utf-8')

          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Android-Testversion `0.11.1` auf `main`.','Android-Testversion `0.11.2` auf `main`.',1)
          p.write_text(s,encoding='utf-8')

          p=Path('Android/CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          marker='# Android Changelog\n'
          entry='''# Android Changelog\n\n## 0.11.2\n- Regression der Erstfreigabe aus 0.11.1 behoben: Der Freigabe-Screen wird jetzt mit `setContentView` tatsächlich angezeigt statt nur eines leeren weißen/dunklen Fensters.\n- Freigabecode und Sprachumschaltung aus 0.11.1 bleiben unverändert.\n'''
          if '## 0.11.2\n' not in s:
              s=s.replace(marker,entry,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java Android/app/build.gradle STATUS.md Android/README.md README.md Android/CHANGELOG.md
          git commit -m 'Fix first-use gate rendering in 0.11.2'
          git push origin HEAD:dev-0.11.1
