name: One-off Android 0.10.19 source typo fix

on:
  push:
    branches:
      - dev-0.10.19
    paths:
      - '.github/workflows/oneoff-0.10.19-fix.yml'

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.19
      - name: Fix HydroStation signatures
        shell: bash
        run: |
          sed -i 's/H{\$roStation/HydroStation/g' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -q 'riverGraphLevelCentimetres(HydroStation station)' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -q 'graphLevelValue(HydroStation station,double rawValue)' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
      - name: Commit source fix
        shell: bash
        run: |
          rm .github/workflows/oneoff-0.10.19-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Rhein graph station signatures'
          git push origin HEAD:dev-0.10.19
