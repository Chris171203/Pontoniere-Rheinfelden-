name: Android CI

on:
  push:
    branches:
      - main
      - 'dev-*'
    paths:
      - 'Android/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/play-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/play-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject generated source patchers
        shell: bash
        run: |
          if find tools -maxdepth 1 -type f -name 'apply_*.py' -print -quit | grep -q .; then
            echo 'Build-time source patchers are not allowed. Commit source changes directly.' >&2
            exit 1
          fi

      - name: Reject personal PFVR access data and production key files
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'id_person=|intern\.pfvr\.ch/index\.php\?what=|key=[0-9a-fA-F]{32,}' . \
              --exclude-dir=.git --exclude-dir=build; then
            echo 'Personal PFVR access data found in repository.' >&2
            exit 1
          fi
          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' \) \
              -not -path './.git/*' -not -path '*/build/*' -print -quit | grep -q .; then
            echo 'Raw signing key file found in repository. Production/upload keys must stay in secrets only.' >&2
            exit 1
          fi

      - name: Verify production package configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'ch.pfvr.app'" Android/app/build.gradle
          grep -Eq 'targetSdk[[:space:]]+36' Android/app/build.gradle
          grep -Fq "applicationIdSuffix '.test'" Android/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests, release lint, debug APK and unsigned release bundle
        working-directory: Android
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintRelease assembleDebug bundleRelease

      - name: Verify packages, permissions and build artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" Android/app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' Android/app/build.gradle | head -1)
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"

          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > signature.txt
          EXPECTED_CERT=$(tr -d '[:space:]' < Android/app/test-signing/CERT_SHA256.txt)
          test -n "$EXPECTED_CERT"
          grep -Fqi "$EXPECTED_CERT" signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app.test' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > permissions.txt
          for permission in \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.READ_CONTACTS \
            android.permission.WRITE_CONTACTS \
            android.permission.GET_ACCOUNTS \
            android.permission.READ_CALENDAR \
            android.permission.WRITE_CALENDAR \
            android.permission.READ_SMS \
            android.permission.RECEIVE_SMS \
            android.permission.SEND_SMS \
            android.permission.READ_CALL_LOG \
            android.permission.WRITE_CALL_LOG \
            android.permission.READ_PHONE_STATE \
            android.permission.READ_PHONE_NUMBERS \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.MANAGE_EXTERNAL_STORAGE \
            android.permission.READ_MEDIA_IMAGES \
            android.permission.READ_MEDIA_VIDEO \
            android.permission.READ_MEDIA_AUDIO \
            android.permission.QUERY_ALL_PACKAGES \
            android.permission.POST_NOTIFICATIONS \
            android.permission.REQUEST_INSTALL_PACKAGES \
            android.permission.SYSTEM_ALERT_WINDOW \
            android.permission.SCHEDULE_EXACT_ALARM \
            android.permission.USE_EXACT_ALARM; do
            if grep -Fq "$permission" permissions.txt; then
              echo "Unexpected sensitive/high-impact permission in final APK: $permission" >&2
              cat permissions.txt >&2
              exit 1
            fi
          done

          RELEASE_AAB=Android/app/build/outputs/bundle/release/app-release.aab
          test -s "$RELEASE_AAB"
          unzip -t "$RELEASE_AAB" >/dev/null
          test -s Android/app/build/reports/lint-results-release.html

          mkdir -p dist
          OUT="PFVR-Rheinfelden-test-${VERSION_NAME}-debug.apk"
          cp "$APK" "dist/$OUT"
          cp Android/app/build/reports/lint-results-release.html dist/lint-results-release.html
          mv signature.txt dist/debug-signature.txt
          mv permissions.txt dist/merged-permissions.txt
          sha256sum "dist/$OUT" > dist/SHA256SUMS.txt
          {
            echo "Version: $VERSION_NAME ($VERSION_CODE)"
            echo 'Package: ch.pfvr.app.test'
            echo "Commit: $GITHUB_SHA"
            echo "Certificate SHA-256: $EXPECTED_CERT"
            echo 'Signing: stable public PFVR test key; production signing is separate'
            echo 'Release variant: lintRelease and bundleRelease completed without production signing secrets'
            echo 'Permissions: final merged APK audited; see merged-permissions.txt'
          } > dist/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Android-test-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
