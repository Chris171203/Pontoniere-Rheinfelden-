name: Android 0.9.3 temperature completion

on:
  push:
    branches:
      - dev-0.9.3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfvr-dev-093-temperature
  cancel-in-progress: false

jobs:
  migrate-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.9.3
          fetch-depth: 0

      - name: Complete separate temperature chart
        run: python tools/apply_temperature_chart.py

      - name: Verify source state
        shell: bash
        run: |
          set -euo pipefail
          SRC=Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -Fq 'private void addRiverStationCharts' "$SRC"
          grep -Fq 'private LinearLayout riverTemperatureCard(int slot)' "$SRC"
          grep -Fq 'SingleSeriesTrendView graph=new SingleSeriesTrendView' "$SRC"
          grep -Fq 'return share.resolveActivity(getPackageManager())!=null;' "$SRC"
          test -f Android/app/src/main/java/ch/pfvr/internapp/SingleSeriesTrendView.java
          grep -Fq 'final class SingleSeriesTrendView extends View' Android/app/src/main/java/ch/pfvr/internapp/SingleSeriesTrendView.java

      - name: Reject personal PFVR access data
        shell: bash
        run: |
          if grep -R -n -E 'id_person=|intern\.pfvr\.ch/index\.php\?what=|key=[0-9a-fA-F]{32,}' Android --exclude-dir=build; then
            echo 'Personal PFVR access data found in Android source.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests and debug APK
        working-directory: Android
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > dist/debug-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app.test' versionCode='17' versionName='0.9.3'"
          cp "$APK" dist/PFVR-Rheinfelden-test-0.9.3-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          {
            echo 'Version: 0.9.3 (17)'
            echo 'Package: ch.pfvr.app.test'
            echo "Source commit before generated source commit: $GITHUB_SHA"
            echo 'Contains separate Wassertemperatur trend chart'
            echo 'Signing: ephemeral GitHub runner debug key; not a stable update identity'
          } > dist/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-0.9.3-temperature-complete
          path: dist/
          if-no-files-found: error

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java PROJECT.md STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Complete separate river temperature chart [skip ci]'
            git push origin HEAD:dev-0.9.3
          fi
