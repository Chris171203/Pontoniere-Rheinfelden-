name: Apply Android 0.11.3 source integration

on:
  push:
    branches:
      - dev-0.11.3
    paths:
      - '.github/workflows/apply-0.11.3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.11.3
      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/0.11.3.part{1,2,3,4,5} \
            | tr -d '[:space:]' \
            | base64 -d \
            | gzip -d > /tmp/change.patch
          patch -p1 < /tmp/change.patch
          git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android PROJECT.md README.md STATUS.md
          git commit -m 'Add Swiss German public landing and social links'
          git push origin HEAD:dev-0.11.3
