name: One-off Android 0.10.16 source update

on:
  push:
    branches:
      - dev-0.10.16
    paths:
      - '.github/workflows/oneoff-0.10.16.yml'

permissions:
  contents: write

jobs:
  apply-source-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.16
      - name: Apply source update
        run: python tools/oneoff_0_10_16.py
      - name: Commit direct source changes
        shell: bash
        run: |
          rm .github/workflows/oneoff-0.10.16.yml tools/oneoff_0_10_16.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show flow and level equally in Rhein summary'
          git push origin HEAD:dev-0.10.16
