name: One-off Android 0.10.19 verified gauge support

on:
  push:
    branches:
      - dev-0.10.19
    paths:
      - '.github/workflows/oneoff-0.10.19.yml'

permissions:
  contents: write

jobs:
  apply-source-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.19

      - name: Restrict cm gauge presentation to verified stations
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update.py
          python /tmp/update.py

      - name: Commit direct source changes
        shell: bash
        run: |
          rm .github/workflows/oneoff-0.10.19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use cm gauge only where verified'
          git push origin HEAD:dev-0.10.19
