name: Fix Android 0.10.22 date label compile

on:
  push:
    branches:
      - dev-0.10.22
    paths:
      - '.github/workflows/fix-0.10.22.yml'

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.22
      - name: Fix embedded JavaScript date detection
        run: python .github/fix_0_10_22.py
      - name: Commit source fix and remove helpers
        run: |
          rm .github/fix_0_10_22.py .github/workflows/fix-0.10.22.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix non-editable day metadata rendering'
          git push origin HEAD:dev-0.10.22
