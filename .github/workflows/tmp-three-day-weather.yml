      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Run unit tests
        working-directory: Android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Commit tested feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/build.gradle \
                  Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java \
                  Android/app/src/main/java/ch/pfvr/internapp/TileLayoutStore.java \
                  Android/app/src/main/java/ch/pfvr/internapp/UiLanguage.java \
                  Android/app/src/main/java/ch/pfvr/internapp/WeatherDaily.java \
                  Android/app/src/test/java/ch/pfvr/internapp/TileLayoutStoreTest.java \
                  Android/app/src/test/java/ch/pfvr/internapp/WeatherDailyTest.java \
                  Android/app/src/test/java/ch/pfvr/internapp/WeatherForecastSourceTest.java \
                  PROJECT.md STATUS.md
          git diff --cached --check
          git commit -m 'Add 3-day weather home tile'
          git push origin HEAD:feature/three-day-weather
