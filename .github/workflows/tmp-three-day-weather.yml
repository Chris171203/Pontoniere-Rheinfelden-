name: Temporary 3-day weather implementation

on:
  push:
    branches: [feature/three-day-weather]
    paths: ['.github/workflows/tmp-three-day-weather.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/three-day-weather

      - name: Apply staged source patch
        shell: bash
        run: python3 .github/tmp-three-day-weather.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Run unit tests
        working-directory: Android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Commit tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java \
                  Android/app/src/main/java/ch/pfvr/internapp/UiLanguage.java \
                  STATUS.md
          git diff --cached --check
          git commit -m 'Render 3-day weather home tile'
          git push origin HEAD:feature/three-day-weather
