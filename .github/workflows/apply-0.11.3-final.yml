name: Apply final Android 0.11.3 localization audit

on:
  push:
    branches:
      - dev-0.11.3-final
    paths:
      - '.github/workflows/apply-0.11.3-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.11.3-final
          fetch-depth: 1

      - name: Apply audited source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/0.11.3/chunk-* > /tmp/pfvr.patch.gz.b64
          echo '6b8ae6395bf705fa7612ad4d882b5458562456decdcbb016288351f076a4836e  /tmp/pfvr.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/pfvr.patch.gz.b64 | gzip -d > /tmp/pfvr.patch
          echo 'cea51666b54ca02e98ec0330fc52cd7cc7a3ad60f933ae00b5a745c0bbf6af90  /tmp/pfvr.patch' | sha256sum -c -
          git apply --check /tmp/pfvr.patch
          git apply /tmp/pfvr.patch
          rm -rf .github/tmp/0.11.3
          rm .github/workflows/apply-0.11.3-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Swiss German UI and public landing links'
          git push origin HEAD:dev-0.11.3-final
