name: Dev Android 0.6.0

on:
  push:
    branches:
      - dev-0.6.0

permissions:
  contents: write

concurrency:
  group: pfvr-dev-060
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.6.0
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply 0.6.0 source patch
        run: python tools/apply_060.py

      - name: Reject personal PFVR access links
        run: |
          if grep -R -n -E 'id_person=|intern\.pfvr\.ch/index\.php\?what=|key=[0-9a-fA-F]{32,}' Android --exclude-dir=build; then
            echo 'Personal PFVR access data found in Android source.' >&2
            exit 1
          fi

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build and verify APK
        working-directory: Android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK metadata
        run: |
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app' versionCode='9' versionName='0.6.0'"
          grep -q 'PREF_INTERNAL_APP_VIEW' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -q 'private void internalSkin' Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java

      - name: Persist verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'Apply verified Android 0.6.0 internal view'
            git pull --rebase origin dev-0.6.0
            git push origin HEAD:dev-0.6.0
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-test-0.6.0-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
