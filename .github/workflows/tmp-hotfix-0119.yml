name: Temporary attendance JS hotfix

on:
  push:
    branches:
      - hotfix/internal-attendance-js-0119
    paths:
      - .github/workflows/tmp-hotfix-0119.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/internal-attendance-js-0119

      - name: Apply staged hotfix
        run: python3 .github/tmp-hotfix-0119.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests and compile
        working-directory: Android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Commit tested hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/build.gradle \
                  Android/app/src/main/java/ch/pfvr/internapp/InternalAttendanceSkin.java \
                  Android/app/src/test/java/ch/pfvr/internapp/InternalAttendanceUiRegressionTest.java \
                  STATUS.md
          git diff --cached --check
          git commit -m 'Fix attendance JavaScript newline escaping'
          git push origin HEAD:hotfix/internal-attendance-js-0119
