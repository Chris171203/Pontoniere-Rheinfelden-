name: Dev Android 0.9.3 verification

on:
  push:
    branches:
      - dev-0.9.3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfvr-dev-093-verification
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.9.3
          fetch-depth: 0

      - name: Apply 0.9.3 cleanup in workspace
        run: python tools/apply_093.py

      - name: Verify source state
        run: |
          set -euo pipefail
          SRC=Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -Fq 'versionCode 17' Android/app/build.gradle
          grep -Fq "versionName '0.9.3'" Android/app/build.gradle
          grep -Fq 'private enum SettingsTab' "$SRC"
          grep -Fq 'private View cashBankStatusCard()' "$SRC"
          grep -Fq 'private View bankChoiceSettingsCard()' "$SRC"
          grep -Fq 'private void chooseBankingApp()' "$SRC"
          grep -Fq 'equalizeSummaryCardHeights(first,second)' "$SRC"
          grep -Fq 'Einstellungen → Zahlung' "$SRC"
          ! grep -Fq 'private class RiverTrendView extends View' "$SRC"
          ! grep -Fq 'private void chooseApp(' "$SRC"
          ! grep -Fq 'PREF_TWINT_PACKAGE' "$SRC"
          ! grep -Fq 'PREF_RIVER_METRIC' "$SRC"

      - name: Reject personal PFVR access data
        run: |
          if grep -R -n -E 'id_person=|intern\.pfvr\.ch/index\.php\?what=' Android --exclude-dir=build; then
            echo 'Personal PFVR access data found in Android source.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests and debug APK
        working-directory: Android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Package verified source and APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app.test' versionCode='17' versionName='0.9.3'"
          cp "$APK" dist/PFVR-Rheinfelden-test-0.9.3-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-0.9.3-verified
          path: dist/
          if-no-files-found: error

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java Android/app/build.gradle PROJECT.md STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Android 0.9.3 settings and UI cleanup [skip ci]'
            git push origin HEAD:dev-0.9.3
          fi
