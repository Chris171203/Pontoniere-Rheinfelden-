name: Play Store bundle

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check release secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'ANDROID_UPLOAD_KEYSTORE_B64 missing'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'ANDROID_UPLOAD_STORE_PASSWORD missing'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'ANDROID_UPLOAD_KEY_ALIAS missing'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'ANDROID_UPLOAD_KEY_PASSWORD missing'; exit 1; }

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pfvr-upload.jks"

      - name: Build signed release AAB
        working-directory: Android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/pfvr-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-PlayStore-AAB
          path: Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
