name: Play Store bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-store-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: play-store
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Require main branch and production package
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Play Store bundles may only be built from main.' >&2
            exit 1
          }
          grep -Fq "applicationId 'ch.pfvr.app'" Android/app/build.gradle
          grep -Eq 'targetSdk[[:space:]]+36' Android/app/build.gradle
          if grep -R -n -E 'id_person=|intern\.pfvr\.ch/index\.php\?what=|key=[0-9a-fA-F]{32,}' Android --exclude-dir=build; then
            echo 'Personal PFVR access data found in Android source.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check release secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'ANDROID_UPLOAD_KEYSTORE_B64 missing' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'ANDROID_UPLOAD_STORE_PASSWORD missing' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'ANDROID_UPLOAD_KEY_ALIAS missing' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'ANDROID_UPLOAD_KEY_PASSWORD missing' >&2; exit 1; }

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore and validate upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pfvr-upload.jks"
          test -s "$RUNNER_TEMP/pfvr-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/pfvr-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Unit tests and signed release AAB
        working-directory: Android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/pfvr-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest bundleRelease

      - name: Verify and package release bundle
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" Android/app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' Android/app/build.gradle | head -1)
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"

          AAB=Android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"

          mkdir -p dist
          # Upload keys are normally self-signed certificates. Cryptographic JAR verification is
          # required here; `-strict` would also treat the expected trust-chain warning as failure.
          jarsigner -verify -verbose -certs "$AAB" > dist/aab-signature.txt
          grep -Fq 'jar verified.' dist/aab-signature.txt

          OUT="PFVR-Rheinfelden-${VERSION_NAME}-${VERSION_CODE}.aab"
          cp "$AAB" "dist/$OUT"
          sha256sum "dist/$OUT" > dist/SHA256SUMS.txt
          {
            echo "Version: $VERSION_NAME ($VERSION_CODE)"
            echo 'Package: ch.pfvr.app'
            echo "Commit: $GITHUB_SHA"
            echo "Upload key alias: $KEY_ALIAS"
            echo 'Artifact: signed Android App Bundle for Google Play upload'
            echo 'Play App Signing: enable/verify in Play Console on first upload'
          } > dist/build-info.txt

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pfvr-upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-PlayStore-AAB-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
