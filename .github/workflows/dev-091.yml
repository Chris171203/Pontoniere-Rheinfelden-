name: Dev Android 0.9.1

on:
  push:
    branches:
      - dev-0.9.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfvr-dev-091
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.9.1
          fetch-depth: 0

      - name: Apply 0.9.1 feedback changes
        run: python tools/apply_091.py

      - name: Reject personal PFVR access data
        run: |
          if grep -R -n -E 'id_person=|intern\.pfvr\.ch/index\.php\?what=|key=[0-9a-fA-F]{32,}' Android --exclude-dir=build; then
            echo 'Personal PFVR access data found in Android source.' >&2
            exit 1
          fi

      - name: Detect protected Android signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Protected release signing is available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Protected Android signing secrets are incomplete. The separated debug test APK will still be built.'
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify BAFU stations and live queries
        run: python tools/probe_bafu_090.py

      - name: Verify 0.9.1 source state
        run: |
          SRC=Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          grep -Fq 'versionCode 15' Android/app/build.gradle
          grep -Fq "versionName '0.9.1'" Android/app/build.gradle
          grep -Fq "applicationIdSuffix '.test'" Android/app/build.gradle
          grep -Fq 'android:label="${appLabel}"' Android/app/src/main/AndroidManifest.xml
          grep -Fq 'PREF_RIVER_SLOT2_ENABLED' "$SRC"
          grep -Fq 'private void addRiverChartSection' "$SRC"
          grep -Fq 'private void refreshHomeLiveViews' "$SRC"
          grep -Fq 'private View cashSummaryRow' "$SRC"
          grep -Fq 'getBoolean(PREF_INTERNAL_APP_VIEW,true)' "$SRC"
          grep -Fq 'metric==RiverMetric.FLOW?statusTextColor' "$SRC"
          jq -e '[.categories[].label] == ["Trinken", "Essen", "Feiern"]' Android/app/src/main/assets/vereinsbeiz_prices.json
          jq -e '[.categories[].items[]] | length == 14' Android/app/src/main/assets/vereinsbeiz_prices.json

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Unit tests and debug test APK
        working-directory: Android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Restore protected upload keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        shell: bash
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pfvr-upload.jks"

      - name: Build release-signed APK
        if: steps.signing.outputs.available == 'true'
        working-directory: Android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/pfvr-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify and package APKs
        env:
          HAS_SIGNING: ${{ steps.signing.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          DEBUG_APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$DEBUG_APK" | tee dist/debug-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEBUG_APK" | grep "package: name='ch.pfvr.app.test' versionCode='15' versionName='0.9.1'"
          cp "$DEBUG_APK" dist/PFVR-Rheinfelden-test-0.9.1-debug.apk
          {
            echo 'Version: 0.9.1 (15)'
            echo 'Debug package: ch.pfvr.app.test'
            echo "Protected release signing available: $HAS_SIGNING"
          } > dist/build-info.txt

          if [[ "$HAS_SIGNING" == 'true' ]]; then
            RELEASE_APK=Android/app/build/outputs/apk/release/app-release.apk
            test -f "$RELEASE_APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK" | tee dist/release-signature.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" | grep "package: name='ch.pfvr.app' versionCode='15' versionName='0.9.1'"
            cp "$RELEASE_APK" dist/PFVR-Rheinfelden-0.9.1-signed.apk
          fi

          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PFVR-Rheinfelden-0.9.1-apks
          path: dist/
          if-no-files-found: error

      - name: Persist verified 0.9.1 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java \
            Android/app/build.gradle \
            Android/app/src/main/AndroidManifest.xml \
            Android/app/src/main/assets/vereinsbeiz_prices.json \
            PROJECT.md STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Android 0.9.1 feedback changes [skip ci]'
            git push origin HEAD:dev-0.9.1
          fi
