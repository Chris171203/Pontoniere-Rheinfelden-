name: One-off Android 0.10.22 day-meta display fix

on:
  push:
    branches:
      - dev-0.10.22
    paths:
      - '.github/workflows/oneoff-0.10.22.yml'

permissions:
  contents: write

jobs:
  apply-source-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.22

      - name: Document scope first
        run: python .github/patch-0.10.22.py status

      - name: Commit status plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git commit -m 'Plan non-editable cook display'
          git push origin HEAD:dev-0.10.22

      - name: Apply source update
        run: python .github/patch-0.10.22.py source

      - name: Commit source update
        run: |
          git add Android README.md
          git commit -m 'Render cook names as non-editable day labels'
          git push origin HEAD:dev-0.10.22
