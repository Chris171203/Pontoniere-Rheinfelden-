name: One-off Android 0.10.20 navigation-stage update

on:
  push:
    branches:
      - dev-0.10.20
    paths:
      - '.github/workflows/oneoff-0.10.20.yml'

permissions:
  contents: write

jobs:
  apply-source-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-0.10.20

      - name: Document scope first
        run: |
          python .tmp/update_0_10_20.py plan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git commit -m 'Plan official Rhine navigation status'
          git push origin HEAD:dev-0.10.20

      - name: Apply navigation-stage update
        run: |
          python .tmp/update_0_10_20.py implement
          rm .tmp/update_0_10_20.py
          rm .github/workflows/oneoff-0.10.20.yml
          git add -A
          git commit -m 'Use official Basel gauge for navigation status'
          git push origin HEAD:dev-0.10.20
