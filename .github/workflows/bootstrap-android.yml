name: Bootstrap Android 0.4.0

on:
  push:
    paths:
      - '.github/workflows/bootstrap-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Import verified source
        env:
          SRC_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-20ec-8210-99a1-4dda855098a5/raw?se=2026-08-31T22%3A28%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=5eef3c12-5af7-5f47-a975-3d0ba269d49d&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T17%3A46%3A51Z&ske=2026-09-01T17%3A46%3A51Z&sks=b&skv=2026-02-06&sig=BecEX5jMOz0U3Lnh1GcVJHKw8oq5ZzbF11CWbvnK%2B6Q%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 "$SRC_URL" -o /tmp/artifact.zip
          mkdir -p /tmp/artifact /tmp/source
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          unzip -q /tmp/artifact/PFVR-Rheinfelden-test-0.4.0-source.zip -d /tmp/source
          mkdir -p Android/app/src/main/java/ch/pfvr/internapp Android/app/src/main/res/drawable
          cp /tmp/source/tmp/pfvr-v2/app/src/main/java/ch/pfvr/internapp/MainActivity.java Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          cp /tmp/source/tmp/pfvr-v2/app/src/main/res/drawable/pfvr_logo.jpg Android/app/src/main/res/drawable/pfvr_logo.jpg
          test "$(git hash-object Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java)" = "10da93fdc3cde90b92dafe57d2835200f81d847e"
          test "$(git hash-object Android/app/src/main/res/drawable/pfvr_logo.jpg)" = "fd0f1ceedb02a2d46e3ba6cb8883f37ab5a4629b"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build Android 0.4.0
        working-directory: Android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK metadata
        run: |
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app' versionCode='7' versionName='0.4.0'"

      - name: Commit verified source
        run: |
          rm -rf Android/.bootstrap Android/app/build Android/.gradle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android
          git commit -m 'Add verified Android 0.4.0 source'
          git push
