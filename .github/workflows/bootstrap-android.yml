name: Bootstrap Android 0.4.0

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Import verified source
        env:
          SRC_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5694-81f4-9a7c-e43a2e57593e/raw?se=2026-08-31T22%3A29%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=f924756d-c7b5-5837-977b-356c27c64487&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T09%3A26%3A28Z&ske=2026-09-01T09%3A26%3A28Z&sks=b&skv=2026-02-06&sig=NAZ4wlSpdSrl77B16FWQmu1X47QU4i3Bo2vf5zmJi8g%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 "$SRC_URL" -o /tmp/artifact.zip
          mkdir -p /tmp/artifact /tmp/source
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          unzip -q /tmp/artifact/PFVR-Rheinfelden-test-0.4.0-source.zip -d /tmp/source
          mkdir -p Android/app/src/main/java/ch/pfvr/internapp Android/app/src/main/res/drawable
          cp /tmp/source/tmp/pfvr-v2/app/src/main/java/ch/pfvr/internapp/MainActivity.java Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java
          cp /tmp/source/tmp/pfvr-v2/app/src/main/res/drawable/pfvr_logo.jpg Android/app/src/main/res/drawable/pfvr_logo.jpg
          test "$(git hash-object Android/app/src/main/java/ch/pfvr/internapp/MainActivity.java)" = "10da93fdc3cde90b92dafe57d2835200f81d847e"
          test "$(git hash-object Android/app/src/main/res/drawable/pfvr_logo.jpg)" = "fd0f1ceedb02a2d46e3ba6cb8883f37ab5a4629b"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build Android 0.4.0
        working-directory: Android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK metadata
        run: |
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='ch.pfvr.app' versionCode='7' versionName='0.4.0'"

      - name: Commit verified source to PR branch
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          rm -rf Android/.bootstrap Android/app/build Android/.gradle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android
          git commit -m 'Add verified Android 0.4.0 source'
          git push origin HEAD:${{ github.head_ref }}
