plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('PFVR_KEYSTORE_FILE')
def releaseSigningAvailable = releaseKeystore != null &&
        System.getenv('PFVR_KEYSTORE_PASSWORD') != null &&
        System.getenv('PFVR_KEY_ALIAS') != null &&
        System.getenv('PFVR_KEY_PASSWORD') != null

android {
    namespace 'ch.pfvr.internapp'
    compileSdk 36

    defaultConfig {
        applicationId 'ch.pfvr.app'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.5.0'
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('PFVR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PFVR_KEY_ALIAS')
                keyPassword System.getenv('PFVR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
