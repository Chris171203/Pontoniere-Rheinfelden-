plugins {
    id 'com.android.application'
}

import java.util.Base64

def uploadKeystore = System.getenv('ANDROID_UPLOAD_KEYSTORE')
def testSigningSource = file('test-signing/pfvr-test.keystore.b64')
def testSigningFile = layout.buildDirectory.file('test-signing/pfvr-test.keystore').get().asFile

if (!testSigningSource.exists()) {
    throw new GradleException('Missing committed PFVR test signing source: ' + testSigningSource)
}
testSigningFile.parentFile.mkdirs()
testSigningFile.bytes = Base64.decoder.decode(testSigningSource.text.replaceAll('\\s', ''))

android {
    namespace 'ch.pfvr.internapp'
    compileSdk 36

    defaultConfig {
        applicationId 'ch.pfvr.app'
        minSdk 26
        targetSdk 36
        versionCode 43
        versionName '0.10.19'
        manifestPlaceholders = [appLabel: 'PFVR Rheinfelden']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        testStable {
            storeFile testSigningFile
            storePassword 'pfvr-test-only'
            keyAlias 'pfvr-test'
            keyPassword 'pfvr-test-only'
        }
        if (uploadKeystore) {
            release {
                storeFile file(uploadKeystore)
                storePassword System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            manifestPlaceholders = [appLabel: 'PFVR Rheinfelden Test']
            signingConfig signingConfigs.testStable
        }
        release {
            minifyEnabled false
            if (uploadKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation 'junit:junit:4.13.2'
}
