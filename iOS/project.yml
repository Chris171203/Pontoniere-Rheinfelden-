name: PFVR
options:
  minimumXcodeGenVersion: '2.42.0'
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.12.6'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
packages:
  PFVRCore:
    path: .
targets:
  PFVR:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pfvr.app.test
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: PFVRCore
        product: PFVRCore
  PFVRCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PFVRCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pfvr.app.coretests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: PFVRCore
        product: PFVRCore
  PFVRAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PFVRAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pfvr.app.apptests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PFVR
      - package: PFVRCore
        product: PFVRCore
  PFVRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PFVRUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pfvr.app.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PFVR
schemes:
  PFVR:
    build:
      targets:
        PFVR: all
        PFVRCoreTests: [test]
        PFVRAppTests: [test]
        PFVRUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: PFVRCoreTests
          parallelizable: false
        - name: PFVRAppTests
          parallelizable: false
        - name: PFVRUITests
          parallelizable: false
    archive:
      config: Release
